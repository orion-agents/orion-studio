---
apiVersion: v1
kind: Namespace
metadata:
  name: ${ORION_STUDIO_KUBE_NAMESPACE}
  labels:
    orion.studio/environment: ${ORION_STUDIO_KUBE_NAMESPACE}

---
kind: Service
apiVersion: v1
metadata:
  namespace: ${ORION_STUDIO_KUBE_NAMESPACE}
  name: ${ORION_STUDIO_SERVICE_NAME}
  annotations:
    service.beta.kubernetes.io/do-loadbalancer-name: "${ORION_STUDIO_SERVICE_NAME}-${ORION_STUDIO_KUBE_NAMESPACE}"
    service.beta.kubernetes.io/do-loadbalancer-size-unit: "${ORION_STUDIO_LOAD_BALANCER_SIZE_UNIT}"
    service.beta.kubernetes.io/do-loadbalancer-tls-ports: "443"
    service.beta.kubernetes.io/do-loadbalancer-certificate-id: ${ORION_STUDIO_DO_CERTIFICATE_ID}
    service.beta.kubernetes.io/do-loadbalancer-disable-lets-encrypt-dns-records: "true"
spec:
  type: LoadBalancer
  selector:
    app: ${ORION_STUDIO_SERVICE_NAME}
  ports:
    - name: web
      protocol: TCP
      port: 443
      targetPort: 8080

---
apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: ${ORION_STUDIO_KUBE_NAMESPACE}
  name: ${ORION_STUDIO_SERVICE_NAME}
  annotations:
    orion.studio/source-revision: ${GITHUB_SHA}

spec:
  replicas: 2
  minReadySeconds: 10
  progressDeadlineSeconds: 600
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: ${ORION_STUDIO_SERVICE_NAME}
  template:
    metadata:
      labels:
        app: ${ORION_STUDIO_SERVICE_NAME}
      annotations:
        orion.studio/source-revision: ${GITHUB_SHA}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: ${ORION_STUDIO_SERVICE_NAME}
          image: "${ORION_STUDIO_IMAGE_ID}"
          args:
            - serve
            - ${ORION_STUDIO_SERVICE_NAME}
          ports:
            - containerPort: 8080
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 1
            periodSeconds: 1
          startupProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 1
            periodSeconds: 1
            failureThreshold: 15
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
          env:
            - name: HTTP_PORT
              value: "8080"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: database
                  key: url
            - name: DATABASE_MAX_CONNECTIONS
              value: "${DATABASE_MAX_CONNECTIONS}"
            - name: ORION_STUDIO_CLIENT_CHECKSUM_SEED
              valueFrom:
                secretKeyRef:
                  name: orion-studio-client
                  key: checksum-seed
            - name: ORION_STUDIO_CLOUD_INTERNAL_API_KEY
              valueFrom:
                secretKeyRef:
                  name: orion-studio-cloud
                  key: internal-api-key
            - name: ORION_STUDIO_WEB_URL
              valueFrom:
                secretKeyRef:
                  name: orion-studio-cloud
                  key: web-url
            - name: ORION_STUDIO_CLOUD_URL
              valueFrom:
                secretKeyRef:
                  name: orion-studio-cloud
                  key: cloud-url
            - name: LIVEKIT_SERVER
              valueFrom:
                secretKeyRef:
                  name: livekit
                  key: server
            - name: LIVEKIT_KEY
              valueFrom:
                secretKeyRef:
                  name: livekit
                  key: key
            - name: LIVEKIT_SECRET
              valueFrom:
                secretKeyRef:
                  name: livekit
                  key: secret
            - name: BLOB_STORE_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: blob-store
                  key: access_key
            - name: BLOB_STORE_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: blob-store
                  key: secret_key
            - name: BLOB_STORE_URL
              valueFrom:
                secretKeyRef:
                  name: blob-store
                  key: url
            - name: BLOB_STORE_REGION
              valueFrom:
                secretKeyRef:
                  name: blob-store
                  key: region
            - name: BLOB_STORE_BUCKET
              valueFrom:
                secretKeyRef:
                  name: blob-store
                  key: bucket
            - name: KINESIS_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: kinesis
                  key: access_key
            - name: KINESIS_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: kinesis
                  key: secret_key
            - name: KINESIS_STREAM
              valueFrom:
                secretKeyRef:
                  name: kinesis
                  key: stream
            - name: KINESIS_REGION
              valueFrom:
                secretKeyRef:
                  name: kinesis
                  key: region
            - name: RUST_BACKTRACE
              value: "1"
            - name: RUST_LOG
              value: ${RUST_LOG}
            - name: LOG_JSON
              value: "true"
            - name: ORION_STUDIO_ENVIRONMENT
              value: ${ORION_STUDIO_ENVIRONMENT}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: temporary-files
              mountPath: /tmp
      volumes:
        - name: temporary-files
          emptyDir:
            medium: Memory
            sizeLimit: 64Mi
      terminationGracePeriodSeconds: 10

---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  namespace: ${ORION_STUDIO_KUBE_NAMESPACE}
  name: ${ORION_STUDIO_SERVICE_NAME}-disruption-budget
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: ${ORION_STUDIO_SERVICE_NAME}

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  namespace: ${ORION_STUDIO_KUBE_NAMESPACE}
  name: ${ORION_STUDIO_SERVICE_NAME}-network
spec:
  podSelector:
    matchLabels:
      app: ${ORION_STUDIO_SERVICE_NAME}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - ipBlock:
            cidr: ${ORION_STUDIO_INGRESS_CIDR}
      ports:
        - protocol: TCP
          port: 8080
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - ipBlock:
            cidr: ${ORION_STUDIO_DATABASE_EGRESS_CIDR}
      ports:
        - protocol: TCP
          port: 5432
    - to:
        - ipBlock:
            cidr: ${ORION_STUDIO_HTTPS_EGRESS_CIDR}
      ports:
        - protocol: TCP
          port: 443
