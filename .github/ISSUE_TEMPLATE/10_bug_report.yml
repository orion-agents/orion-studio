name: Report a bug
description: Report a problem with Orion Studio.
type: Bug
labels: "state:needs triage"
body:
  - type: markdown
    attributes:
      value: |
        Is this bug already reported? Upvote to get it noticed faster. [Here’s the search](https://github.com/orion-agents/orion-studio/issues). Upvote means giving it a :+1: reaction.

        Feature request? Open a blank issue and prefix the title with `Feature request:`.

        Just have a question or need support? Read the [Preview support guide](https://github.com/orion-agents/orion-studio/blob/main/SUPPORT.md).
  - type: textarea
    attributes:
      label: Reproduction steps
      description: A step-by-step description of how to reproduce the bug from a **clean Orion Studio install**. The more context you provide, the easier it is to find and fix the problem fast.
      placeholder: |
        1. Start Orion Studio
        2. Click X
    validations:
      required: true
  - type: textarea
    attributes:
      label: Current vs. Expected behavior
      description: |
        Current behavior (screenshots, videos, etc. are appreciated), vs. what you expected the behavior to be.

      placeholder: |
        Current behavior: <screenshot with an arrow> The icon is blue. Expected behavior: The icon should be red because this is what the setting is documented to do.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Orion Studio version and system specs
      description: |
        Open the command palette in Orion Studio, then enter the legacy-compatible command ID `zed: copy system specs into clipboard`. The `zed:` prefix is retained only for action compatibility.
      placeholder: |
        Orion Studio: v1.16.0 (Orion Studio Preview <commit SHA>)
        OS: macOS 15.1
        Memory: 36 GiB
        Architecture: aarch64
    validations:
      required: true
  - type: textarea
    attributes:
      label: Attach Orion Studio log file
      description: |
        Open the command palette in Orion Studio, then enter the legacy-compatible command ID `zed: open log` to see the last 1000 lines. Or enter `zed: reveal log in file manager` to reveal the log file itself. The `zed:` prefix is retained only for action compatibility.

        ⚠️ **Please review your log file for secrets (API keys, tokens, etc.) and partially or fully redact them before posting.**
      value: |
        <details><summary>Orion Studio.log</summary>

        <!-- Paste your log inside the code block. -->
        ```log

        ```

        </details>
    validations:
      required: false
  - type: textarea
    attributes:
      label: Relevant Orion Studio settings
      description: |
        Open the command palette in Orion Studio, then enter the legacy-compatible command ID `zed: open settings file` and copy/paste any relevant (e.g., LSP-specific) settings. The `zed:` prefix is retained only for action compatibility.

        ⚠️ **Please review your settings file for secrets (API keys, tokens, etc.) and partially or fully redact them before posting.**
      value: |
        <details><summary>settings.json</summary>

        <!-- Paste your settings inside the code block. -->
        ```json

        ```

        </details>
    validations:
      required: false
  - type: textarea
    attributes:
      label: Relevant Keymap
      description: |
        Open the command palette in Orion Studio, then enter the legacy-compatible command ID `zed: open keymap file` and copy/paste the file’s contents. The `zed:` prefix is retained only for action compatibility.
      value: |
        <details><summary>keymap.json</summary>

        <!-- Paste your keymap file inside the code block. -->
        ```json

        ```

        </details>
    validations:
      required: false
  - type: textarea
    attributes:
      label: (for AI issues) Model provider details
      placeholder: |
        - Provider: (Anthropic via API key, Copilot Chat, Mistral, OpenAI, etc.)
        - Model Name: (Claude Sonnet 4.5, Gemini 3.1 Pro, GPT-5)
        - Mode: (Agent Panel, Inline Assistant, or Terminal Assistant)
        - Other details (ACPs, MCPs, other settings, etc.):
    validations:
      required: false
  - type: input
    attributes:
      label: Apple chip model
      description: The downloadable Preview supports Apple Silicon only.
      placeholder: Apple M1, M2, M3, or later
    validations:
      required: true
