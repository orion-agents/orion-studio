name: Report a crash
description: Orion Studio is crashing or freezing or hanging.
type: Crash
labels: "state:needs triage"
body:
  - type: textarea
    attributes:
      label: Reproduction steps
      description: A step-by-step description of how to reproduce the crash from a **clean Orion Studio install**. The more context you provide, the easier it is to find and fix the problem fast.
      placeholder: |
        1. Start Orion Studio
        2. Perform an action
        3. Orion Studio crashes
    validations:
      required: true
  - type: textarea
    attributes:
      label: Orion Studio version and system specs
      description: |
        Open the command palette in Orion Studio, then run “Copy System Specs Into Clipboard”.
      placeholder: |
        Orion Studio: v1.16.0 (Orion Studio Preview <commit SHA>)
        OS: macOS 15.1
        Memory: 36 GiB
        Architecture: aarch64
    validations:
      required: true
  - type: textarea
    attributes:
      label: Attach Orion Studio log file
      description: |
        Open the command palette in Orion Studio, then run `Open Log` to see the last 1000 lines. Run `Reveal Log In File Manager` to reveal the full log file.

        ⚠️ **Please review your log file for secrets (API keys, tokens, etc.) and partially or fully redact them before posting.**
      value: |
        <details><summary>Orion Studio.log</summary>

        <!-- Paste your log inside the code block. -->
        ```log

        ```

        </details>
    validations:
      required: false
