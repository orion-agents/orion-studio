# Generated from xtask::workflows::release
# Rebuild with `cargo xtask workflows`.
name: release
env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: '1'
on:
  push:
    tags:
    - v*
    - '!v*-pre'
permissions:
  contents: read
jobs:
  validate_release_ref:
    if: github.repository == 'orion-agents/orion-studio' && vars.ORION_STUDIO_RELEASE_ENABLED == 'true'
    runs-on: namespace-profile-2x4-ubuntu-2404
    steps:
    - name: steps::checkout_repo
      uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
      with:
        clean: false
        fetch-depth: 0
        persist-credentials: false
        fetch-tags: true
        ref: ${{ github.ref }}
    - name: release::validate_release_ref
      run: |
        set -euo pipefail

        if [[ "${GITHUB_REF:-}" != refs/tags/* ]]; then
            echo "::error::release workflow requires a tag ref"
            exit 1
        fi
        if [[ ! "${GITHUB_REF_NAME:-}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-pre)?$ ]]; then
            echo "::error::release tag must be vMAJOR.MINOR.PATCH or vMAJOR.MINOR.PATCH-pre"
            exit 1
        fi
        if [[ ! "${GITHUB_SHA:-}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::GITHUB_SHA is not an immutable commit SHA"
            exit 1
        fi

        git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
        checked_out_sha=$(git rev-parse 'HEAD^{commit}')
        tag_sha=$(git rev-parse "${GITHUB_REF}^{commit}")
        main_sha=$(git rev-parse 'refs/remotes/origin/main^{commit}')
        if [[ "$checked_out_sha" != "$GITHUB_SHA" || "$tag_sha" != "$GITHUB_SHA" ]]; then
            echo "::error::checked-out source does not match the triggering tag commit"
            exit 1
        fi
        if ! git merge-base --is-ancestor "$GITHUB_SHA" "$main_sha"; then
            echo "::error::release tag commit is not reachable from protected main"
            exit 1
        fi
    timeout-minutes: 5
  run_tests_mac:
    needs:
    - validate_release_ref
    if: github.repository == 'orion-agents/orion-studio'
    runs-on: namespace-profile-mac-large
    steps:
    - name: steps::checkout_repo
      uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
      with:
        clean: false
    - name: steps::setup_cargo_config
      run: |
        mkdir -p ./../.cargo
        cp ./.cargo/ci-config.toml ./../.cargo/config.toml
    - name: steps::cache_rust_dependencies_namespace
      uses: namespacelabs/nscloud-cache-action@a90bb5d4b27522ce881c6e98eebd7d7e6d1653f9
      with:
        cache: rust
        path: ~/.rustup
    - name: steps::setup_node
      uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
      with:
        node-version: '24'
        check-latest: true
        package-manager-cache: false
    - name: steps::cargo_install_nextest
      uses: taiki-e/install-action@a6b2e2dcd845ddd7f509ce4f3ed3d922b80cc5d9
      with:
        tool: nextest
    - name: steps::clear_target_dir_if_large
      run: ./script/clear-target-dir-if-larger-than 350 200
    - name: steps::setup_sccache
      run: ./script/setup-sccache
      env:
        R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
        R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
        R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        SCCACHE_BUCKET: ${{ vars.ORION_STUDIO_SCCACHE_R2_BUCKET }}
    - name: steps::cargo_nextest
      run: cargo nextest run --workspace --no-fail-fast --no-tests=warn
    - name: steps::show_sccache_stats
      run: sccache --show-stats || true
    - name: steps::cleanup_cargo_config
      if: always()
      run: |
        rm -rf ./../.cargo
    timeout-minutes: 60
  run_tests_linux:
    needs:
    - validate_release_ref
    if: github.repository == 'orion-agents/orion-studio'
    runs-on: namespace-profile-16x32-ubuntu-2204
    env:
      CC: clang
      CXX: clang++
    steps:
    - name: steps::checkout_repo
      uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
      with:
        clean: false
    - name: steps::setup_cargo_config
      run: |
        mkdir -p ./../.cargo
        cp ./.cargo/ci-config.toml ./../.cargo/config.toml
    - name: steps::cache_rust_dependencies_namespace
      uses: namespacelabs/nscloud-cache-action@a90bb5d4b27522ce881c6e98eebd7d7e6d1653f9
      with:
        cache: rust
        path: ~/.rustup
    - name: steps::setup_linux
      run: ./script/linux
    - name: steps::download_wasi_sdk
      run: ./script/download-wasi-sdk
    - name: steps::setup_node
      uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
      with:
        node-version: '24'
        check-latest: true
        package-manager-cache: false
    - name: steps::cargo_install_nextest
      uses: taiki-e/install-action@a6b2e2dcd845ddd7f509ce4f3ed3d922b80cc5d9
      with:
        tool: nextest
    - name: steps::clear_target_dir_if_large
      run: ./script/clear-target-dir-if-larger-than 350 200
    - name: steps::setup_sccache
      run: ./script/setup-sccache
      env:
        R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
        R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
        R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        SCCACHE_BUCKET: ${{ vars.ORION_STUDIO_SCCACHE_R2_BUCKET }}
    - name: steps::cargo_nextest
      run: cargo nextest run --workspace --no-fail-fast --no-tests=warn
    - name: steps::show_sccache_stats
      run: sccache --show-stats || true
    - name: steps::cleanup_cargo_config
      if: always()
      run: |
        rm -rf ./../.cargo
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:15@sha256:1b92e7a80c021647bf70f5d3eb66066a998e4f5cf43c07bb9dc9f729782cf88e
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
        - 5432:5432
        options: --health-cmd pg_isready --health-interval 500ms --health-timeout 5s --health-retries 10
  run_tests_windows:
    needs:
    - validate_release_ref
    if: github.repository == 'orion-agents/orion-studio'
    runs-on: self-32vcpu-windows-2022
    steps:
    - name: steps::checkout_repo
      uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
      with:
        clean: false
    - name: steps::setup_cargo_config
      run: |
        New-Item -ItemType Directory -Path "./../.cargo" -Force
        Copy-Item -Path "./.cargo/ci-config.toml" -Destination "./../.cargo/config.toml"
      shell: pwsh
    - name: steps::setup_node
      uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
      with:
        node-version: '24'
        check-latest: true
        package-manager-cache: false
    - name: steps::clear_target_dir_if_large
      run: ./script/clear-target-dir-if-larger-than.ps1 350 200
      shell: pwsh
    - name: steps::setup_sccache
      run: ./script/setup-sccache.ps1
      shell: pwsh
      env:
        R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
        R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
        R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        SCCACHE_BUCKET: ${{ vars.ORION_STUDIO_SCCACHE_R2_BUCKET }}
    - name: steps::cargo_nextest
      run: cargo nextest run --workspace --no-fail-fast --no-tests=warn
      shell: pwsh
    - name: steps::show_sccache_stats
      run: if ($env:RUSTC_WRAPPER) { & $env:RUSTC_WRAPPER --show-stats }; exit 0
      shell: pwsh
    - name: steps::cleanup_cargo_config
      if: always()
      run: |
        Remove-Item -Recurse -Path "./../.cargo" -Force -ErrorAction SilentlyContinue
      shell: pwsh
    timeout-minutes: 60
  clippy_mac:
    needs:
    - validate_release_ref
    if: github.repository == 'orion-agents/orion-studio'
    runs-on: namespace-profile-mac-large
    steps:
    - name: steps::checkout_repo
      uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
      with:
        clean: false
    - name: steps::setup_cargo_config
      run: |
        mkdir -p ./../.cargo
        cp ./.cargo/ci-config.toml ./../.cargo/config.toml
    - name: steps::cache_rust_dependencies_namespace
      uses: namespacelabs/nscloud-cache-action@a90bb5d4b27522ce881c6e98eebd7d7e6d1653f9
      with:
        cache: rust
        path: ~/.rustup
    - name: steps::setup_sccache
      run: ./script/setup-sccache
      env:
        R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
        R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
        R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        SCCACHE_BUCKET: ${{ vars.ORION_STUDIO_SCCACHE_R2_BUCKET }}
    - name: steps::clippy
      run: ./script/clippy
    - name: steps::show_sccache_stats
      run: sccache --show-stats || true
    timeout-minutes: 60
  clippy_linux:
    needs:
    - validate_release_ref
    if: github.repository == 'orion-agents/orion-studio'
    runs-on: namespace-profile-16x32-ubuntu-2204
    env:
      CC: clang
      CXX: clang++
    steps:
    - name: steps::checkout_repo
      uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
      with:
        clean: false
    - name: steps::setup_cargo_config
      run: |
        mkdir -p ./../.cargo
        cp ./.cargo/ci-config.toml ./../.cargo/config.toml
    - name: steps::cache_rust_dependencies_namespace
      uses: namespacelabs/nscloud-cache-action@a90bb5d4b27522ce881c6e98eebd7d7e6d1653f9
      with:
        cache: rust
        path: ~/.rustup
    - name: steps::setup_linux
      run: ./script/linux
    - name: steps::download_wasi_sdk
      run: ./script/download-wasi-sdk
    - name: steps::setup_sccache
      run: ./script/setup-sccache
      env:
        R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
        R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
        R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        SCCACHE_BUCKET: ${{ vars.ORION_STUDIO_SCCACHE_R2_BUCKET }}
    - name: steps::clippy
      run: ./script/clippy
    - name: steps::show_sccache_stats
      run: sccache --show-stats || true
    timeout-minutes: 60
  clippy_windows:
    needs:
    - validate_release_ref
    if: github.repository == 'orion-agents/orion-studio'
    runs-on: self-32vcpu-windows-2022
    steps:
    - name: steps::checkout_repo
      uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
      with:
        clean: false
    - name: steps::setup_cargo_config
      run: |
        New-Item -ItemType Directory -Path "./../.cargo" -Force
        Copy-Item -Path "./.cargo/ci-config.toml" -Destination "./../.cargo/config.toml"
      shell: pwsh
    - name: steps::setup_sccache
      run: ./script/setup-sccache.ps1
      shell: pwsh
      env:
        R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
        R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
        R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        SCCACHE_BUCKET: ${{ vars.ORION_STUDIO_SCCACHE_R2_BUCKET }}
    - name: steps::clippy
      run: ./script/clippy.ps1
      shell: pwsh
    - name: steps::show_sccache_stats
      run: if ($env:RUSTC_WRAPPER) { & $env:RUSTC_WRAPPER --show-stats }; exit 0
      shell: pwsh
    timeout-minutes: 60
  check_scripts:
    needs:
    - validate_release_ref
    if: github.repository == 'orion-agents/orion-studio'
    runs-on: namespace-profile-8x16-ubuntu-2204
    steps:
    - name: steps::checkout_repo
      uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
      with:
        clean: false
    - name: run_tests::check_scripts::run_shellcheck
      run: ./script/shellcheck-scripts error
    - name: steps::cache_rust_dependencies_namespace
      uses: namespacelabs/nscloud-cache-action@a90bb5d4b27522ce881c6e98eebd7d7e6d1653f9
      with:
        cache: rust
        path: ~/.rustup
    - name: run_tests::check_scripts::check_xtask_workflows
      run: |
        cargo xtask workflows
        workflow_changes=$(git status --porcelain --untracked-files=all -- .github/workflows extensions/workflows)
        if [[ -n "$workflow_changes" ]]; then
          printf '%s\n' "$workflow_changes"
          echo "Error: generated workflow files are not synchronized with their Rust sources"
          echo "Please run 'cargo xtask workflows' locally and commit the changes"
          exit 1
        fi
    - id: get_actionlint
      name: run_tests::check_scripts::download_actionlint
      run: bash <(curl https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)
    - name: run_tests::check_scripts::run_actionlint
      run: '"$ACTIONLINT_BIN" -color'
      env:
        ACTIONLINT_BIN: ${{ steps.get_actionlint.outputs.executable }}
    - name: run_tests::check_scripts::run_zizmor
      uses: zizmorcore/zizmor-action@6599ee8b7a49aef6a770f63d261d214911a7ce02
      with:
        advanced-security: false
        min-severity: high
        version: latest
    timeout-minutes: 60
  create_draft_release:
    needs:
    - validate_release_ref
    if: github.repository == 'orion-agents/orion-studio' && vars.ORION_STUDIO_RELEASE_ENABLED == 'true'
    runs-on: namespace-profile-2x4-ubuntu-2404
    steps:
    - id: generate-token
      name: steps::authenticate_as_orion_automation
      uses: actions/create-github-app-token@f8d387b68d61c58ab83c6c016672934102569859
      with:
        app-id: ${{ secrets.ORION_STUDIO_AUTOMATION_APP_ID }}
        private-key: ${{ secrets.ORION_STUDIO_AUTOMATION_APP_PRIVATE_KEY }}
        owner: ${{ github.repository_owner }}
        repositories: ${{ github.event.repository.name }}
        permission-contents: write
    - name: steps::checkout_repo
      uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
      with:
        clean: false
        fetch-depth: 25
        ref: ${{ github.ref }}
    - name: script/determine-release-channel
      run: script/determine-release-channel
    - name: release::create_sentry_release
      uses: getsentry/action-release@526942b68292201ac6bbb99b9a0747d4abee354c
      with:
        environment: production
      env:
        SENTRY_ORG: ${{ vars.ORION_STUDIO_SENTRY_ORGANIZATION }}
        SENTRY_PROJECT: ${{ vars.ORION_STUDIO_SENTRY_PROJECT }}
        SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
    - name: mkdir -p target/
      run: mkdir -p target/
    - name: release::create_draft_release::generate_release_notes
      run: node --redirect-warnings=/dev/null ./script/draft-release-notes "$RELEASE_VERSION" "$RELEASE_CHANNEL" > target/release-notes.md
    - name: release::create_draft_release::create_release
      run: script/create-draft-release target/release-notes.md
      env:
        GITHUB_TOKEN: ${{ steps.generate-token.outputs.token }}
    timeout-minutes: 60
    environment: production
  compliance_check:
    needs:
    - validate_release_ref
    if: github.repository == 'orion-agents/orion-studio' && vars.ORION_STUDIO_RELEASE_ENABLED == 'true'
    runs-on: namespace-profile-2x4-ubuntu-2404
    steps:
    - name: steps::checkout_repo
      uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
      with:
        clean: false
        fetch-depth: 0
        ref: ${{ github.ref }}
    - name: steps::cache_rust_dependencies_namespace
      uses: namespacelabs/nscloud-cache-action@a90bb5d4b27522ce881c6e98eebd7d7e6d1653f9
      with:
        cache: rust
        path: ~/.rustup
    - id: run-compliance-check
      name: release::add_compliance_steps::run_compliance_check
      run: |
        cargo xtask compliance version "$GITHUB_REF_NAME" --report-path "compliance-report-${GITHUB_REF_NAME}.md"
      env:
        GITHUB_APP_ID: ${{ secrets.ORION_STUDIO_AUTOMATION_APP_ID }}
        GITHUB_APP_KEY: ${{ secrets.ORION_STUDIO_AUTOMATION_APP_PRIVATE_KEY }}
        ORION_STUDIO_AUTOMATION_BOT_LOGIN: ${{ vars.ORION_STUDIO_AUTOMATION_BOT_LOGIN }}
        ORION_STUDIO_AUTOMATION_GIT_EMAIL: ${{ vars.ORION_STUDIO_AUTOMATION_GIT_EMAIL }}
        ORION_STUDIO_AUTOMATION_GIT_NAME: ${{ vars.ORION_STUDIO_AUTOMATION_GIT_NAME }}
        ORION_STUDIO_RELEASE_COMPLIANCE: '1'
      continue-on-error: true
    - name: run_bundling::upload_artifact
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: compliance-report-${{ github.ref_name }}.md
        path: compliance-report-${{ github.ref_name }}.md
        if-no-files-found: error
    - name: send_compliance_slack_notification
      if: ${{ always() }}
      run: |
        if [ "$COMPLIANCE_OUTCOME" == "success" ]; then
            STATUS="✅ Compliance check passed for $COMPLIANCE_TAG"
            MESSAGE=$(printf "%s\n\nReport: %s" "$STATUS" "$ARTIFACT_URL")
        else
            STATUS="❌ Preliminary compliance check failed (but this can still be fixed while the builds are running!) for $COMPLIANCE_TAG"
            MESSAGE=$(printf "%s\n\nReport: %s\nPRs needing review: %s" "$STATUS" "$ARTIFACT_URL" "https://github.com/orion-agents/orion-studio/pulls?q=is%3Apr+is%3Aclosed+label%3A%22PR+state%3Aneeds+review%22")
        fi

        curl -X POST -H 'Content-type: application/json' \
            --data "$(jq -n --arg text "$MESSAGE" '{"text": $text}')" \
            "$SLACK_WEBHOOK"
      env:
        SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK_WORKFLOW_FAILURES }}
        COMPLIANCE_OUTCOME: ${{ steps.run-compliance-check.outcome }}
        COMPLIANCE_TAG: ${{ github.ref_name }}
        ARTIFACT_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}#artifacts
    outputs:
      outcome: ${{ steps.run-compliance-check.outputs.outcome }}
    timeout-minutes: 60
    environment: production
  bundle_linux_aarch64:
    needs:
    - validate_release_ref
    - run_tests_linux
    - clippy_linux
    - check_scripts
    runs-on: namespace-profile-8x32-ubuntu-2004-arm-m4
    env:
      CARGO_INCREMENTAL: 0
      CC: clang-18
      CXX: clang++-18
      ORION_STUDIO_REQUIRE_SENTRY: '1'
    steps:
    - name: steps::checkout_repo
      uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
      with:
        clean: false
        persist-credentials: false
    - name: steps::cache_rust_dependencies_namespace
      uses: namespacelabs/nscloud-cache-action@a90bb5d4b27522ce881c6e98eebd7d7e6d1653f9
      with:
        cache: rust
        path: ~/.rustup
    - name: run_bundling::validate_release_channel
      run: |
        set -euo pipefail
        channel=$(tr -d '\r\n' < crates/zed/RELEASE_CHANNEL)
        case "$channel" in
            stable)
                if [[ "${GITHUB_REF_TYPE:-}" != "tag" || ! "${GITHUB_REF_NAME:-}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
                    echo "::error::stable artifacts require an exact vMAJOR.MINOR.PATCH tag"
                    exit 1
                fi
                ;;
            preview)
                if [[ "${GITHUB_REF_TYPE:-}" != "tag" || ! "${GITHUB_REF_NAME:-}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-pre$ ]]; then
                    echo "::error::preview artifacts require an exact vMAJOR.MINOR.PATCH-pre tag"
                    exit 1
                fi
                ;;
            nightly)
                if [[ "${GITHUB_REF:-}" != "refs/heads/main" ]]; then
                    echo "::error::nightly artifacts must be built from refs/heads/main"
                    exit 1
                fi
                ;;
            *)
                echo "::error::release artifacts cannot use channel '$channel'"
                exit 1
                ;;
        esac
    - name: steps::setup_sentry
      uses: matbour/setup-sentry-cli@3e938c54b3018bdd019973689ef984e033b0454b
      with:
        token: ${{ secrets.SENTRY_AUTH_TOKEN }}
    - name: steps::setup_linux
      run: ./script/linux
    - name: steps::download_wasi_sdk
      run: ./script/download-wasi-sdk
    - name: ./script/bundle-linux
      run: ./script/bundle-linux
      env:
        ORION_STUDIO_CLIENT_CHECKSUM_SEED: ${{ secrets.ORION_STUDIO_CLIENT_CHECKSUM_SEED }}
        ORION_STUDIO_MINIDUMP_ENDPOINT: ${{ secrets.ORION_STUDIO_SENTRY_MINIDUMP_ENDPOINT }}
        ORION_STUDIO_SENTRY_ORGANIZATION: ${{ vars.ORION_STUDIO_SENTRY_ORGANIZATION }}
        ORION_STUDIO_SENTRY_PROJECT: ${{ vars.ORION_STUDIO_SENTRY_PROJECT }}
        SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
    - name: run_bundling::upload_artifact
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: orion-studio-linux-aarch64.tar.gz
        path: target/release/orion-studio-linux-aarch64.tar.gz
        if-no-files-found: error
    - name: run_bundling::upload_artifact
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: orion-studio-remote-server-linux-aarch64.gz
        path: target/orion-studio-remote-server-linux-aarch64.gz
        if-no-files-found: error
    timeout-minutes: 60
    environment: production
  bundle_linux_x86_64:
    needs:
    - validate_release_ref
    - run_tests_linux
    - clippy_linux
    - check_scripts
    runs-on: namespace-profile-32x64-ubuntu-2004
    env:
      CARGO_INCREMENTAL: 0
      CC: clang-18
      CXX: clang++-18
      ORION_STUDIO_REQUIRE_SENTRY: '1'
    steps:
    - name: steps::checkout_repo
      uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
      with:
        clean: false
        persist-credentials: false
    - name: steps::cache_rust_dependencies_namespace
      uses: namespacelabs/nscloud-cache-action@a90bb5d4b27522ce881c6e98eebd7d7e6d1653f9
      with:
        cache: rust
