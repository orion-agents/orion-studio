# Generated from xtask::workflows::run_bundling
# Rebuild with `cargo xtask workflows`.
name: run_bundling
env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: '1'
on:
  pull_request:
    types:
    - labeled
    - synchronize
permissions:
  contents: read
jobs:
  bundle_linux_aarch64:
    if: |-
      (github.event.action == 'labeled' && github.event.label.name == 'run-bundling') ||
      (github.event.action == 'synchronize' && contains(github.event.pull_request.labels.*.name, 'run-bundling'))
    runs-on: namespace-profile-8x32-ubuntu-2004-arm-m4
    env:
      CARGO_INCREMENTAL: 0
      CC: clang-18
      CXX: clang++-18
    steps:
    - name: steps::checkout_repo
      uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
      with:
        clean: false
        persist-credentials: false
    - name: steps::cache_rust_dependencies_namespace
      uses: namespacelabs/nscloud-cache-action@a90bb5d4b27522ce881c6e98eebd7d7e6d1653f9
      with:
        cache: rust
        path: ~/.rustup
    - name: steps::setup_linux
      run: ./script/linux
    - name: steps::download_wasi_sdk
      run: ./script/download-wasi-sdk
    - name: ./script/bundle-linux
      run: ./script/bundle-linux
      env: {}
    - name: run_bundling::upload_artifact
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: orion-studio-linux-aarch64.tar.gz
        path: target/release/orion-studio-linux-aarch64.tar.gz
        if-no-files-found: error
    - name: run_bundling::upload_artifact
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: orion-studio-remote-server-linux-aarch64.gz
        path: target/orion-studio-remote-server-linux-aarch64.gz
        if-no-files-found: error
    timeout-minutes: 60
  bundle_linux_x86_64:
    if: |-
      (github.event.action == 'labeled' && github.event.label.name == 'run-bundling') ||
      (github.event.action == 'synchronize' && contains(github.event.pull_request.labels.*.name, 'run-bundling'))
    runs-on: namespace-profile-32x64-ubuntu-2004
    env:
      CARGO_INCREMENTAL: 0
      CC: clang-18
      CXX: clang++-18
    steps:
    - name: steps::checkout_repo
      uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
      with:
        clean: false
        persist-credentials: false
    - name: steps::cache_rust_dependencies_namespace
      uses: namespacelabs/nscloud-cache-action@a90bb5d4b27522ce881c6e98eebd7d7e6d1653f9
      with:
        cache: rust
        path: ~/.rustup
    - name: steps::setup_linux
      run: ./script/linux
    - name: steps::download_wasi_sdk
      run: ./script/download-wasi-sdk
    - name: ./script/bundle-linux
      run: ./script/bundle-linux
      env: {}
    - name: run_bundling::upload_artifact
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: orion-studio-linux-x86_64.tar.gz
        path: target/release/orion-studio-linux-x86_64.tar.gz
        if-no-files-found: error
    - name: run_bundling::upload_artifact
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: orion-studio-remote-server-linux-x86_64.gz
        path: target/orion-studio-remote-server-linux-x86_64.gz
        if-no-files-found: error
    timeout-minutes: 60
  build_static_bwrap_linux_aarch64:
    if: |-
      (github.event.action == 'labeled' && github.event.label.name == 'run-bundling') ||
      (github.event.action == 'synchronize' && contains(github.event.pull_request.labels.*.name, 'run-bundling'))
    runs-on: namespace-profile-8x32-ubuntu-2004-arm-m4
    steps:
    - name: steps::cache_nix_dependencies_namespace
      uses: namespacelabs/nscloud-cache-action@a90bb5d4b27522ce881c6e98eebd7d7e6d1653f9
      with:
        cache: nix
    - name: run_bundling::build_static_bwrap
      uses: cachix/install-nix-action@02a151ada4993995686f9ed4f1be7cfbb229e56f
    - name: run_bundling::build_static_bwrap
      uses: cachix/cachix-action@0fc020193b5a1fa3ac4575aa3a7d3aa6a35435ad
      with:
        name: ${{ vars.ORION_STUDIO_CACHIX_CACHE_NAME }}
        cachixArgs: -v
    - name: run_bundling::build_static_bwrap
      run: nix build nixpkgs#pkgsStatic.bubblewrap -L
    - name: run_bundling::build_static_bwrap
      run: |
        cp result/bin/bwrap bwrap-linux-aarch64
        chmod 755 bwrap-linux-aarch64
        gzip -f --stdout --best bwrap-linux-aarch64 > bwrap-linux-aarch64.gz
    - name: run_bundling::upload_artifact
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: bwrap-linux-aarch64.gz
        path: bwrap-linux-aarch64.gz
        if-no-files-found: error
    timeout-minutes: 60
  build_static_bwrap_linux_x86_64:
    if: |-
      (github.event.action == 'labeled' && github.event.label.name == 'run-bundling') ||
      (github.event.action == 'synchronize' && contains(github.event.pull_request.labels.*.name, 'run-bundling'))
    runs-on: namespace-profile-32x64-ubuntu-2004
    steps:
    - name: steps::cache_nix_dependencies_namespace
      uses: namespacelabs/nscloud-cache-action@a90bb5d4b27522ce881c6e98eebd7d7e6d1653f9
      with:
        cache: nix
    - name: run_bundling::build_static_bwrap
      uses: cachix/install-nix-action@02a151ada4993995686f9ed4f1be7cfbb229e56f
    - name: run_bundling::build_static_bwrap
      uses: cachix/cachix-action@0fc020193b5a1fa3ac4575aa3a7d3aa6a35435ad
      with:
        name: ${{ vars.ORION_STUDIO_CACHIX_CACHE_NAME }}
        cachixArgs: -v
    - name: run_bundling::build_static_bwrap
      run: nix build nixpkgs#pkgsStatic.bubblewrap -L
    - name: run_bundling::build_static_bwrap
      run: |
        cp result/bin/bwrap bwrap-linux-x86_64
        chmod 755 bwrap-linux-x86_64
        gzip -f --stdout --best bwrap-linux-x86_64 > bwrap-linux-x86_64.gz
    - name: run_bundling::upload_artifact
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: bwrap-linux-x86_64.gz
        path: bwrap-linux-x86_64.gz
        if-no-files-found: error
    timeout-minutes: 60
  bundle_mac_aarch64:
    if: |-
      (github.event.action == 'labeled' && github.event.label.name == 'run-bundling') ||
      (github.event.action == 'synchronize' && contains(github.event.pull_request.labels.*.name, 'run-bundling'))
    runs-on: namespace-profile-mac-large
    env:
      CARGO_INCREMENTAL: 0
    steps:
    - name: steps::checkout_repo
      uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
      with:
        clean: false
        persist-credentials: false
    - name: steps::cache_rust_dependencies_namespace
      uses: namespacelabs/nscloud-cache-action@a90bb5d4b27522ce881c6e98eebd7d7e6d1653f9
      with:
        cache: rust
        path: ~/.rustup
    - name: steps::setup_node
      uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
      with:
        node-version: '24'
        check-latest: true
        package-manager-cache: false
    - name: steps::clear_target_dir_if_large
      run: ./script/clear-target-dir-if-larger-than 350 200
    - name: run_bundling::bundle_mac::bundle_mac
      run: ./script/bundle-mac aarch64-apple-darwin
      env: {}
    - name: run_bundling::upload_artifact
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: Orion-Studio-aarch64.dmg
        path: target/aarch64-apple-darwin/release/Orion-Studio-aarch64.dmg
        if-no-files-found: error
    - name: run_bundling::upload_artifact
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: orion-studio-remote-server-macos-aarch64.gz
        path: target/orion-studio-remote-server-macos-aarch64.gz
        if-no-files-found: error
    timeout-minutes: 60
  bundle_mac_x86_64:
    if: |-
      (github.event.action == 'labeled' && github.event.label.name == 'run-bundling') ||
      (github.event.action == 'synchronize' && contains(github.event.pull_request.labels.*.name, 'run-bundling'))
    runs-on: namespace-profile-mac-large
    env:
      CARGO_INCREMENTAL: 0
    steps:
    - name: steps::checkout_repo
      uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
      with:
        clean: false
        persist-credentials: false
    - name: steps::cache_rust_dependencies_namespace
      uses: namespacelabs/nscloud-cache-action@a90bb5d4b27522ce881c6e98eebd7d7e6d1653f9
      with:
        cache: rust
        path: ~/.rustup
    - name: steps::setup_node
      uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
      with:
        node-version: '24'
        check-latest: true
        package-manager-cache: false
    - name: steps::clear_target_dir_if_large
      run: ./script/clear-target-dir-if-larger-than 350 200
    - name: run_bundling::bundle_mac::bundle_mac
      run: ./script/bundle-mac x86_64-apple-darwin
      env: {}
    - name: run_bundling::upload_artifact
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: Orion-Studio-x86_64.dmg
        path: target/x86_64-apple-darwin/release/Orion-Studio-x86_64.dmg
        if-no-files-found: error
    - name: run_bundling::upload_artifact
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: orion-studio-remote-server-macos-x86_64.gz
        path: target/orion-studio-remote-server-macos-x86_64.gz
        if-no-files-found: error
    timeout-minutes: 60
  bundle_windows_aarch64:
    if: |-
      (github.event.action == 'labeled' && github.event.label.name == 'run-bundling') ||
      (github.event.action == 'synchronize' && contains(github.event.pull_request.labels.*.name, 'run-bundling'))
    runs-on: self-32vcpu-windows-2022
    env:
      CARGO_INCREMENTAL: 0
    steps:
    - name: steps::checkout_repo
      uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
      with:
        clean: false
        persist-credentials: false
    - name: steps::clear_target_dir_if_large
      run: ./script/clear-target-dir-if-larger-than.ps1 350 200
      shell: pwsh
    - name: run_bundling::bundle_windows::bundle_windows
      run: script/bundle-windows.ps1 -Architecture aarch64
      shell: pwsh
      env:
        ORION_STUDIO_WINDOWS_PUBLISHER: Orion Studio Development
        ORION_STUDIO_WINDOWS_APPX_PUBLISHER: CN=Orion Studio Development
        ORION_STUDIO_WINDOWS_ALLOW_UNSIGNED_DEV: '1'
        ORION_STUDIO_REQUIRE_SIGNED_RELEASE: '0'
      working-directory: ${{ github.workspace }}
    - name: run_bundling::upload_artifact
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: Orion-Studio-Dev-Unsigned-aarch64.exe
        path: target/Orion-Studio-Dev-Unsigned-aarch64.exe
        if-no-files-found: error
    - name: run_bundling::upload_artifact
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: orion-studio-remote-server-windows-aarch64.zip
        path: target/orion-studio-remote-server-windows-aarch64.zip
        if-no-files-found: error
    timeout-minutes: 60
  bundle_windows_x86_64:
    if: |-
      (github.event.action == 'labeled' && github.event.label.name == 'run-bundling') ||
      (github.event.action == 'synchronize' && contains(github.event.pull_request.labels.*.name, 'run-bundling'))
    runs-on: self-32vcpu-windows-2022
    env:
      CARGO_INCREMENTAL: 0
    steps:
    - name: steps::checkout_repo
      uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
      with:
        clean: false
        persist-credentials: false
    - name: steps::clear_target_dir_if_large
      run: ./script/clear-target-dir-if-larger-than.ps1 350 200
      shell: pwsh
    - name: run_bundling::bundle_windows::bundle_windows
      run: script/bundle-windows.ps1 -Architecture x86_64
      shell: pwsh
      env:
        ORION_STUDIO_WINDOWS_PUBLISHER: Orion Studio Development
        ORION_STUDIO_WINDOWS_APPX_PUBLISHER: CN=Orion Studio Development
        ORION_STUDIO_WINDOWS_ALLOW_UNSIGNED_DEV: '1'
        ORION_STUDIO_REQUIRE_SIGNED_RELEASE: '0'
      working-directory: ${{ github.workspace }}
    - name: run_bundling::upload_artifact
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: Orion-Studio-Dev-Unsigned-x86_64.exe
        path: target/Orion-Studio-Dev-Unsigned-x86_64.exe
        if-no-files-found: error
    - name: run_bundling::upload_artifact
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: orion-studio-remote-server-windows-x86_64.zip
        path: target/orion-studio-remote-server-windows-x86_64.zip
        if-no-files-found: error
    timeout-minutes: 60
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true
defaults:
  run:
    shell: bash -euxo pipefail {0}
