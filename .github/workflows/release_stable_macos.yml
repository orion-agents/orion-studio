name: Release macOS Apple Silicon Stable

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing signed tag in the form vMAJOR.MINOR.PATCH
        required: true
        type: string
      build_only:
        description: Build, sign, notarize and staple without creating or updating a GitHub Release
        required: false
        type: boolean
        default: false
      runner_mode:
        description: Runner that performs the build. self-hosted is the dedicated Mac; hosted is the GitHub-hosted macOS ARM image.
        required: false
        type: choice
        options:
          - self-hosted
          - hosted
        default: self-hosted

permissions:
  contents: read

concurrency:
  group: release-stable-macos-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  validate_release:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: production
    outputs:
      tag_commit: ${{ steps.source.outputs.tag_commit }}
      support_script_sha256: ${{ steps.support.outputs.sha256 }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - name: Verify immutable Stable source
        id: source
        env:
          ALLOWED_SIGNERS_BASE64: ${{ vars.ORION_STUDIO_RELEASE_SSH_ALLOWED_SIGNERS_BASE64 }}
          RELEASE_ENABLED: ${{ vars.ORION_STUDIO_RELEASE_ENABLED }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          [[ "${GITHUB_REPOSITORY}" == orion-agents/orion-studio ]]
          [[ "${GITHUB_REF}" == refs/heads/main ]]
          [[ "${RELEASE_ENABLED}" == true ]]
          [[ "${RELEASE_TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ -n "${ALLOWED_SIGNERS_BASE64}" ]]
          allowed_signers="${RUNNER_TEMP}/allowed-signers"
          printf '%s' "${ALLOWED_SIGNERS_BASE64}" | base64 --decode > "${allowed_signers}"
          git config --local gpg.format ssh
          git config --local gpg.ssh.allowedSignersFile "${allowed_signers}"
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          git fetch --force --no-tags origin "refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}"
          [[ "$(git cat-file -t "refs/tags/${RELEASE_TAG}")" == tag ]]
          git verify-tag "${RELEASE_TAG}"
          tag_commit=$(git rev-parse "${RELEASE_TAG}^{commit}")
          git merge-base --is-ancestor "${tag_commit}" origin/main
          release_channel_file=$(git ls-tree -r --name-only "${tag_commit}" | awk '/\/RELEASE_CHANNEL$/ && !found { print; found = 1 }')
          [[ -n "${release_channel_file}" ]]
          [[ "$(git show "${tag_commit}:${release_channel_file}")" == stable ]]
          echo "tag_commit=${tag_commit}" >> "$GITHUB_OUTPUT"
      - name: Stage release support script
        id: support
        run: |
          set -euo pipefail
          support_directory="${RUNNER_TEMP}/release-support"
          mkdir -p "${support_directory}"
          install -m 755 script/bundle-mac "${support_directory}/bundle-mac"
          bash -n "${support_directory}/bundle-mac"
          support_sha256=$(shasum -a 256 "${support_directory}/bundle-mac" | awk '{print $1}')
          echo "sha256=${support_sha256}" >> "$GITHUB_OUTPUT"
          echo "Release support script SHA-256: ${support_sha256}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: stable-macos-release-support-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release-support/bundle-mac
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  build_release:
    needs: validate_release
    # `hosted` is the GitHub-hosted macOS ARM image; the self-hosted label stays
    # available as the controlled fallback until the hosted path has proven itself
    # twice. A pinned label is used rather than `macos-latest` so the image cannot
    # drift under the release pipeline.
    runs-on: ${{ inputs.runner_mode == 'hosted' && 'macos-15' || fromJSON('["self-hosted", "macOS", "ARM64", "orion-studio-macos-release"]') }}
    timeout-minutes: 360
    environment: production
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_RELEASE_DEBUG: '0'
      CARGO_PROFILE_RELEASE_STRIP: symbols
      ORION_STUDIO_REQUIRE_SIGNED_RELEASE: '1'
      ORION_STUDIO_REQUIRE_SENTRY: '0'
      # The archive cache lives on the self-hosted machine. A hosted runner has no
      # such path, so the variable is only offered there; `bundle-mac` then downloads
      # the pinned archive and verifies the same SHA-256.
      ORION_STUDIO_BUNDLED_GIT_ARCHIVE: ${{ inputs.runner_mode == 'self-hosted' && vars.ORION_STUDIO_BUNDLED_GIT_ARCHIVE || '' }}
    steps:
      - name: Verify runner capacity
        env:
          RUNNER_MODE: ${{ inputs.runner_mode }}
        run: |
          set -euo pipefail
          [[ "$(uname -m)" == arm64 ]]
          command -v cargo >/dev/null
          command -v jq >/dev/null
          command -v shasum >/dev/null
          xcrun --find notarytool >/dev/null
          xcrun --find stapler >/dev/null
          # The dugite-native archive is an optional cache, not a required input.
          # Hosted runners leave it unset and `bundle-mac` downloads the pinned
          # archive itself; a self-hosted runner may point at a local copy. Either
          # way the same pinned hash is enforced, and a configured-but-missing cache
          # fails here instead of silently falling back to a different Git binary.
          if [[ -n "${ORION_STUDIO_BUNDLED_GIT_ARCHIVE:-}" ]]; then
            [[ -f "${ORION_STUDIO_BUNDLED_GIT_ARCHIVE}" ]]
            [[ "$(shasum -a 256 "${ORION_STUDIO_BUNDLED_GIT_ARCHIVE}" | awk '{print $1}')" == f014b290f36d121bbc47b29b556044c4f6a2f6494cf78ed2eacfa501b77363b6 ]]
            tar -tzf "${ORION_STUDIO_BUNDLED_GIT_ARCHIVE}" | awk '$0 == "./bin/git" { found = 1 } END { exit !found }'
          fi
          available_kib=$(LC_ALL=C df -Pk "$GITHUB_WORKSPACE" | awk 'NR == 2 { print $4 }')
          # The dedicated Mac is expected to keep enough headroom for a from-scratch
          # build, so it fails closed. The hosted path is here to be *measured*: an
          # early disk rejection would make the "only the disk is inadequate"
          # conclusion unreachable, and the recorded resource step reports the real
          # numbers either way.
          if [[ "${RUNNER_MODE}" == "self-hosted" ]]; then
            (( available_kib >= 100 * 1024 * 1024 ))
          else
            echo "Hosted runner available disk: ${available_kib} KiB"
          fi
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: stable-macos-release-support-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release-support
      - name: Check out validated release source
        env:
          RELEASE_COMMIT: ${{ needs.validate_release.outputs.tag_commit }}
        run: |
          set -euo pipefail
          # The release source comes from the repository itself, never from a
          # runner-local path: a local checkout is mutable state the workflow cannot
          # verify, and a hosted runner has none. The repository is public, so this
          # needs no credential in `.git/config`. The HEAD equality check is what
          # actually proves the tree is the validated commit.
          git init "$GITHUB_WORKSPACE"
          git -C "$GITHUB_WORKSPACE" clean -ffdx -e target/
          if git -C "$GITHUB_WORKSPACE" remote get-url release-source >/dev/null 2>&1; then
            git -C "$GITHUB_WORKSPACE" remote remove release-source
          fi
          git -C "$GITHUB_WORKSPACE" remote add release-source "https://github.com/${GITHUB_REPOSITORY}.git"
          git -C "$GITHUB_WORKSPACE" fetch --no-tags --depth=1 release-source "${RELEASE_COMMIT}"
          git -C "$GITHUB_WORKSPACE" checkout --detach --force FETCH_HEAD
          [[ "$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)" == "${RELEASE_COMMIT}" ]]
          [[ -z "$(git -C "$GITHUB_WORKSPACE" status --porcelain)" ]]
      - name: Apply verified release support script
        env:
          EXPECTED_SUPPORT_SHA256: ${{ needs.validate_release.outputs.support_script_sha256 }}
        run: |
          set -euo pipefail
          support_script="${RUNNER_TEMP}/release-support/bundle-mac"
          [[ -f "${support_script}" ]]
          [[ ! -L "${support_script}" ]]
          actual_sha256=$(shasum -a 256 "${support_script}" | awk '{print $1}')
          [[ "${actual_sha256}" == "${EXPECTED_SUPPORT_SHA256}" ]]
          install -m 755 "${support_script}" "$GITHUB_WORKSPACE/script/bundle-mac"
          echo "Applied verified release support script: ${actual_sha256}"
      - name: Run source gates
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "orion-studio") | .version')
          [[ "${version}" == "${RELEASE_TAG#v}" ]]
          bash -n script/bundle-mac
          ./script/test-orion-brand
          # The v1.17.0 tag predates the current fixture fingerprints. These exact
          # entries cover fake filesystem credentials and the public AWS CLI package key.
          if [[ "${RELEASE_TAG}" == v1.17.0 ]]; then
            cat >> .gitleaksignore <<'EOF'
          0d36638173451aad2d36931490d0c028e2819ae2:crates/agent/src/tools/read_file_tool.rs:generic-api-key:1031
          0d36638173451aad2d36931490d0c028e2819ae2:crates/agent/src/tools/read_file_tool.rs:generic-api-key:1548
          0d36638173451aad2d36931490d0c028e2819ae2:crates/agent/src/tools/read_file_tool.rs:generic-api-key:1610
          0d36638173451aad2d36931490d0c028e2819ae2:crates/agent/src/tools/read_file_tool.rs:generic-api-key:1664
          0d36638173451aad2d36931490d0c028e2819ae2:crates/agent/src/tools/grep_tool.rs:generic-api-key:1048
          0d36638173451aad2d36931490d0c028e2819ae2:crates/agent/src/tools/list_directory_tool.rs:generic-api-key:559
          0d36638173451aad2d36931490d0c028e2819ae2:crates/agent/src/tools/list_directory_tool.rs:generic-api-key:884
          0d36638173451aad2d36931490d0c028e2819ae2:crates/dev_container/src/devcontainer_manifest.rs:generic-api-key:9540
          EOF
          fi
          ./script/check-secrets
          ./script/check-macos-entitlements
          ./script/test-uninstall
          cargo fmt --all -- --check
          git diff --check
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '24.21.0'
          check-latest: false
          package-manager-cache: false
      - name: Build, sign, notarize, and staple
        env:
          APPLE_NOTARIZATION_ISSUER_ID: ${{ secrets.APPLE_NOTARIZATION_ISSUER_ID }}
          APPLE_NOTARIZATION_KEY: ${{ secrets.APPLE_NOTARIZATION_KEY }}
          APPLE_NOTARIZATION_KEY_ID: ${{ secrets.APPLE_NOTARIZATION_KEY_ID }}
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          ORION_STUDIO_MACOS_SIGNING_IDENTITY: ${{ vars.ORION_STUDIO_MACOS_SIGNING_IDENTITY }}
          ORION_STUDIO_MACOS_TEAM_ID: ${{ vars.ORION_STUDIO_MACOS_TEAM_ID }}
          RELEASE_TAG: ${{ inputs.tag }}
          BUILD_LOG: ${{ runner.temp }}/release-build.log
        run: |
          set -euo pipefail
          # `/usr/bin/time -l` reports peak resident set size, which the hosted-runner
          # sizing decision in the cross-platform remediation plan depends on. Its
          # output goes to stderr, so `tee` keeps the build's own log and the
          # measurement in one file.
          /usr/bin/time -l env GITHUB_REF_TYPE=tag GITHUB_REF_NAME="$RELEASE_TAG" \
            ./script/bundle-mac aarch64-apple-darwin 2>&1 | tee "${BUILD_LOG}"
      - name: Record build resources
        if: always()
        env:
          BUILD_LOG: ${{ runner.temp }}/release-build.log
          RELEASE_COMMIT: ${{ needs.validate_release.outputs.tag_commit }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          dmg_path="target/aarch64-apple-darwin/release/Orion-Studio-aarch64.dmg"
          available_kib=$(LC_ALL=C df -Pk "$GITHUB_WORKSPACE" | awk 'NR == 2 { print $4 }')
          target_bytes=$(du -sk target 2>/dev/null | awk '{ print $1 * 1024 }')
          peak_rss_bytes=$(awk '/maximum resident set size/ { print $1 }' "${BUILD_LOG}" 2>/dev/null | tail -1)
          elapsed_seconds=$(awk '/^[[:space:]]*[0-9]+\.[0-9]+ real/ { print $1 }' "${BUILD_LOG}" 2>/dev/null | tail -1)
          artifact_bytes=$(stat -f%z "$dmg_path" 2>/dev/null || echo 0)

          jq -n \
            --arg tag "$RELEASE_TAG" \
            --arg commit "$RELEASE_COMMIT" \
            --argjson available_kib "${available_kib:-0}" \
            --argjson target_bytes "${target_bytes:-0}" \
            --argjson peak_rss_bytes "${peak_rss_bytes:-0}" \
            --argjson elapsed_seconds "${elapsed_seconds:-0}" \
            --argjson artifact_bytes "${artifact_bytes:-0}" \
            '{
              tag: $tag,
              commit: $commit,
              available_disk_bytes_after_build: ($available_kib * 1024),
              target_bytes: $target_bytes,
              peak_rss_bytes: $peak_rss_bytes,
              elapsed_seconds: $elapsed_seconds,
              artifact_bytes: $artifact_bytes
            }' > "${RUNNER_TEMP}/build-resources.json"
          cat "${RUNNER_TEMP}/build-resources.json"
          {
            echo '### Build resources'
            echo ''
            echo '| Metric | Value |'
            echo '| --- | --- |'
            echo "| available disk after build | ${available_kib} KiB |"
            echo "| target size | ${target_bytes} bytes |"
            echo "| peak RSS | ${peak_rss_bytes} bytes |"
            echo "| build elapsed | ${elapsed_seconds} s |"
            echo "| DMG size | ${artifact_bytes} bytes |"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Verify signed and stapled DMG
        env:
          DMG_PATH: target/aarch64-apple-darwin/release/Orion-Studio-aarch64.dmg
          ORION_STUDIO_MACOS_SIGNING_IDENTITY: ${{ vars.ORION_STUDIO_MACOS_SIGNING_IDENTITY }}
          ORION_STUDIO_MACOS_TEAM_ID: ${{ vars.ORION_STUDIO_MACOS_TEAM_ID }}
        run: |
          set -euo pipefail
          [[ -f "$DMG_PATH" ]]
          codesign --verify --deep --strict --verbose=2 "$DMG_PATH"
          codesign -d --verbose=4 "$DMG_PATH" 2>&1 | grep -F "Authority=${ORION_STUDIO_MACOS_SIGNING_IDENTITY}"
          codesign -d --verbose=4 "$DMG_PATH" 2>&1 | grep -F "TeamIdentifier=${ORION_STUDIO_MACOS_TEAM_ID}"
          stapler validate "$DMG_PATH"
          (cd target/aarch64-apple-darwin/release && shasum -a 256 Orion-Studio-aarch64.dmg > SHA256SUMS && shasum -a 256 -c SHA256SUMS)
      - name: Write platform manifest
        env:
          RELEASE_COMMIT: ${{ needs.validate_release.outputs.tag_commit }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          dmg_path="target/aarch64-apple-darwin/release/Orion-Studio-aarch64.dmg"
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "orion-studio") | .version')
          sha256=$(shasum -a 256 "$dmg_path" | awk '{ print $1 }')
          manifest="${RUNNER_TEMP}/platform-manifest.json"
          jq -n \
            --arg tag "$RELEASE_TAG" \
            --arg commit "$RELEASE_COMMIT" \
            --arg version "$version" \
            --arg artifact "Orion-Studio-aarch64.dmg" \
            --arg sha256 "$sha256" \
            '{
              tag: $tag,
              commit: $commit,
              version: $version,
              channel: "stable",
              platform: "macos",
              architecture: "aarch64",
              artifact: $artifact,
              sha256: $sha256,
              signed: true
            }' > "$manifest"
          # Structural assertions mirroring tooling/release/platform-manifest.schema.json.
          # The assembly job re-hashes every artifact, so these only reject a malformed
          # manifest — they never establish trust in the recorded digest.
          jq -e '
            (.tag | test("^v[0-9]+\\.[0-9]+\\.[0-9]+$")) and
            (.commit | test("^[0-9a-f]{40}$")) and
            (.version | test("^[0-9]+\\.[0-9]+\\.[0-9]+$")) and
            (.channel == "stable") and
            (.platform == "macos") and
            (.architecture == "aarch64") and
            (.artifact | length > 0) and
            (.sha256 | test("^[0-9a-f]{64}$")) and
            (.signed == true)
          ' "$manifest" > /dev/null
          [[ "${version}" == "${RELEASE_TAG#v}" ]]
          cat "$manifest"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: stable-macos-aarch64-${{ inputs.tag }}
          path: |
            target/aarch64-apple-darwin/release/Orion-Studio-aarch64.dmg
            target/aarch64-apple-darwin/release/SHA256SUMS
            ${{ runner.temp }}/build-resources.json
            ${{ runner.temp }}/platform-manifest.json
          compression-level: 0

  create_draft:
    needs: [validate_release, build_release]
    # Build-only runs stop before this job: they exist so a tag can be rebuilt and
    # measured repeatedly without touching a public Release.
    if: ${{ !inputs.build_only }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: production
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: stable-macos-aarch64-${{ inputs.tag }}
          path: release-artifacts
      - name: Verify assets and create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          (cd release-artifacts && shasum -a 256 -c SHA256SUMS)
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            [[ "$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)" == true ]]
          else
            gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --draft --title "Orion Studio ${RELEASE_TAG}" --generate-notes
          fi
          gh release upload "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --clobber release-artifacts/Orion-Studio-aarch64.dmg release-artifacts/SHA256SUMS
