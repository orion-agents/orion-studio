name: Release Linux Stable

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing signed tag in the form vMAJOR.MINOR.PATCH
        required: true
        type: string
      architecture:
        description: Target architecture.
        required: false
        type: choice
        options:
          - x86_64
          - aarch64
        default: x86_64
      build_only:
        description: Build and verify without creating or updating a GitHub Release
        required: false
        type: boolean
        default: false
      source_run_id:
        description: Reuse the verified build artifact from an earlier run of this workflow
        required: false
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: release-stable-linux-${{ inputs.tag }}-${{ inputs.architecture }}
  cancel-in-progress: false

jobs:
  validate_release:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: production
    outputs:
      tag_commit: ${{ steps.source.outputs.tag_commit }}
      support_script_sha256: ${{ steps.support.outputs.sha256 }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - name: Verify immutable Stable source
        id: source
        env:
          ALLOWED_SIGNERS_BASE64: ${{ vars.ORION_STUDIO_RELEASE_SSH_ALLOWED_SIGNERS_BASE64 }}
          RELEASE_ENABLED: ${{ vars.ORION_STUDIO_RELEASE_ENABLED }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          [[ "${GITHUB_REPOSITORY}" == orion-agents/orion-studio ]]
          [[ "${GITHUB_REF}" == refs/heads/main ]]
          [[ "${RELEASE_ENABLED}" == true ]]
          [[ "${RELEASE_TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ -n "${ALLOWED_SIGNERS_BASE64}" ]]
          allowed_signers="${RUNNER_TEMP}/allowed-signers"
          printf '%s' "${ALLOWED_SIGNERS_BASE64}" | base64 --decode > "${allowed_signers}"
          git config --local gpg.format ssh
          git config --local gpg.ssh.allowedSignersFile "${allowed_signers}"
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          git fetch --force --no-tags origin "refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}"
          [[ "$(git cat-file -t "refs/tags/${RELEASE_TAG}")" == tag ]]
          git verify-tag "${RELEASE_TAG}"
          tag_commit=$(git rev-parse "${RELEASE_TAG}^{commit}")
          git merge-base --is-ancestor "${tag_commit}" origin/main
          release_channel_file=$(git ls-tree -r --name-only "${tag_commit}" | awk '/\/RELEASE_CHANNEL$/ && !found { print; found = 1 }')
          [[ -n "${release_channel_file}" ]]
          [[ "$(git show "${tag_commit}:${release_channel_file}")" == stable ]]
          echo "tag_commit=${tag_commit}" >> "$GITHUB_OUTPUT"
      - name: Stage release support script
        id: support
        run: |
          set -euo pipefail
          support_directory="${RUNNER_TEMP}/release-support"
          mkdir -p "${support_directory}"
          install -m 755 script/bundle-linux "${support_directory}/bundle-linux"
          install -m 755 script/verify-linux-release "${support_directory}/verify-linux-release"
          install -m 755 script/verify-linux-installation "${support_directory}/verify-linux-installation"
          bash -n "${support_directory}/bundle-linux"
          bash -n "${support_directory}/verify-linux-release"
          bash -n "${support_directory}/verify-linux-installation"
          # The digest covers the script *contents*, in a fixed order, so it is
          # independent of where each job happens to have staged them.
          support_sha256=$(cat \
            "${support_directory}/bundle-linux" \
            "${support_directory}/verify-linux-release" \
            "${support_directory}/verify-linux-installation" \
            | shasum -a 256 | awk '{print $1}')
          echo "sha256=${support_sha256}" >> "$GITHUB_OUTPUT"
          echo "Release support scripts SHA-256: ${support_sha256}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: stable-linux-release-support-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/release-support/bundle-linux
            ${{ runner.temp }}/release-support/verify-linux-release
            ${{ runner.temp }}/release-support/verify-linux-installation
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  build_release:
    needs: validate_release
    if: ${{ inputs.source_run_id == '' }}
    runs-on: ${{ inputs.architecture == 'aarch64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    container:
      image: ${{ inputs.architecture == 'aarch64' && 'ubuntu:22.04' || 'ubuntu:20.04' }}
    defaults:
      run:
        shell: bash
    timeout-minutes: 360
    environment: production
    env:
      CARGO_INCREMENTAL: '0'
      CC: ${{ inputs.architecture == 'aarch64' && 'clang' || 'clang-18' }}
      CXX: ${{ inputs.architecture == 'aarch64' && 'clang++' || 'clang++-18' }}
      ORION_STUDIO_REQUIRE_SENTRY: '0'
      ORION_STUDIO_RELEASE_CHANNEL: stable
    steps:
      - name: Install source checkout tools
        run: |
          set -euo pipefail
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends ca-certificates curl file git lsb-release perl python3 sudo time
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: stable-linux-release-support-${{ github.run_id }}
          path: ${{ runner.temp }}/release-support
      - name: Check out validated release source
        env:
          RELEASE_COMMIT: ${{ needs.validate_release.outputs.tag_commit }}
        run: |
          set -euo pipefail
          # The release source comes from the repository itself, never from a
          # runner-local path, and the HEAD equality check is what proves the tree is
          # the validated commit.
          git init "$GITHUB_WORKSPACE"
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git -C "$GITHUB_WORKSPACE" remote add release-source "https://github.com/${GITHUB_REPOSITORY}.git"
          git -C "$GITHUB_WORKSPACE" fetch --no-tags --depth=1 release-source "${RELEASE_COMMIT}"
          git -C "$GITHUB_WORKSPACE" checkout --detach --force FETCH_HEAD
          [[ "$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)" == "${RELEASE_COMMIT}" ]]
          [[ -z "$(git -C "$GITHUB_WORKSPACE" status --porcelain)" ]]
      - name: Apply verified release support scripts
        env:
          EXPECTED_SUPPORT_SHA256: ${{ needs.validate_release.outputs.support_script_sha256 }}
        run: |
          set -euo pipefail
          support_directory="${RUNNER_TEMP}/release-support"
          for support_script in bundle-linux verify-linux-release verify-linux-installation; do
            staged="${support_directory}/${support_script}"
            [[ -f "${staged}" ]]
            [[ ! -L "${staged}" ]]
            install -m 755 "${staged}" "$GITHUB_WORKSPACE/script/${support_script}"
          done
          actual_sha256=$(cat \
            "$GITHUB_WORKSPACE/script/bundle-linux" \
            "$GITHUB_WORKSPACE/script/verify-linux-release" \
            "$GITHUB_WORKSPACE/script/verify-linux-installation" \
            | shasum -a 256 | awk '{print $1}')
          [[ "${actual_sha256}" == "${EXPECTED_SUPPORT_SHA256}" ]]
          echo "Applied verified release support scripts: ${actual_sha256}"
      - name: Install build dependencies on the minimum supported Ubuntu release
        env:
          DEBIAN_FRONTEND: noninteractive
          TZ: Etc/UTC
        run: |
          set -euo pipefail
          ./script/linux
          source "${HOME}/.cargo/env"
          echo "${HOME}/.cargo/bin" >> "${GITHUB_PATH}"
          rustup component add llvm-tools-preview
          objcopy="$(rustc --print sysroot)/lib/rustlib/$(rustc -vV | awk '/^host:/ { print $2 }')/bin/llvm-objcopy"
          [[ -x "${objcopy}" ]]
          echo "LLVM_OBJCOPY=${objcopy}" >> "${GITHUB_ENV}"
          rustc --version
          "${CC}" --version
          "${CXX}" --version
      - name: Install ARM SME runtime compatible with Ubuntu 22.04
        if: ${{ inputs.architecture == 'aarch64' }}
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          set -euo pipefail
          apt-get install -y --no-install-recommends gnupg
          echo 'deb https://ppa.launchpadcontent.net/ubuntu-toolchain-r/test/ubuntu jammy main' > /etc/apt/sources.list.d/ubuntu-toolchain-r-test.list
          curl -fsSL 'https://keyserver.ubuntu.com/pks/lookup?op=get&search=0x1E9377A2BA9EF27F' \
            | sed -n '/-----BEGIN PGP PUBLIC KEY BLOCK-----/,/-----END PGP PUBLIC KEY BLOCK-----/p' \
            | gpg --dearmor -o /etc/apt/trusted.gpg.d/ubuntu-toolchain-r-test.gpg
          apt-get update
          apt-get install -y --no-install-recommends libgcc-s1
          nm -D --defined-only /lib/aarch64-linux-gnu/libgcc_s.so.1 | grep -F __arm_tpidr2_save
          dpkg-query -W libgcc-s1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Run source gates
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "orion-studio") | .version')
          [[ "${version}" == "${RELEASE_TAG#v}" ]]
          [[ "$(tr -d '\r\n' < crates/zed/RELEASE_CHANNEL)" == stable ]]
          bash -n script/bundle-linux
          bash -n script/verify-linux-release
          bash -n script/verify-linux-installation
          ./script/test-orion-brand
          # The v1.17.0 tag predates the current fixture fingerprints. These exact
          # entries cover fake filesystem credentials and the public AWS CLI package key.
          # This mirrors the macOS Stable workflow: any Stable platform validating that
          # audited tag needs the same ignore list. Both copies should move to a shared
          # validate step rather than being kept in two places.
          if [[ "${RELEASE_TAG}" == v1.17.0 ]]; then
            cat >> .gitleaksignore <<'EOF'
          0d36638173451aad2d36931490d0c028e2819ae2:crates/agent/src/tools/read_file_tool.rs:generic-api-key:1031
          0d36638173451aad2d36931490d0c028e2819ae2:crates/agent/src/tools/read_file_tool.rs:generic-api-key:1548
          0d36638173451aad2d36931490d0c028e2819ae2:crates/agent/src/tools/read_file_tool.rs:generic-api-key:1610
          0d36638173451aad2d36931490d0c028e2819ae2:crates/agent/src/tools/read_file_tool.rs:generic-api-key:1664
          0d36638173451aad2d36931490d0c028e2819ae2:crates/agent/src/tools/grep_tool.rs:generic-api-key:1048
          0d36638173451aad2d36931490d0c028e2819ae2:crates/agent/src/tools/list_directory_tool.rs:generic-api-key:559
          0d36638173451aad2d36931490d0c028e2819ae2:crates/agent/src/tools/list_directory_tool.rs:generic-api-key:884
          0d36638173451aad2d36931490d0c028e2819ae2:crates/dev_container/src/devcontainer_manifest.rs:generic-api-key:9540
          EOF
          fi
          # Same fixtures, re-pinned to the v1.17.1 tag commit: with a depth=1
          # checkout gitleaks attributes every finding to the tag commit, so each
          # tag needs its own block.
          if [[ "${RELEASE_TAG}" == v1.17.1 ]]; then
            cat >> .gitleaksignore <<'EOF'
          7986331633204422a2b48f1386cbea9aff81204f:crates/agent/src/tools/read_file_tool.rs:generic-api-key:1031
          7986331633204422a2b48f1386cbea9aff81204f:crates/agent/src/tools/read_file_tool.rs:generic-api-key:1548
          7986331633204422a2b48f1386cbea9aff81204f:crates/agent/src/tools/read_file_tool.rs:generic-api-key:1610
          7986331633204422a2b48f1386cbea9aff81204f:crates/agent/src/tools/read_file_tool.rs:generic-api-key:1664
          7986331633204422a2b48f1386cbea9aff81204f:crates/agent/src/tools/grep_tool.rs:generic-api-key:1048
          7986331633204422a2b48f1386cbea9aff81204f:crates/agent/src/tools/list_directory_tool.rs:generic-api-key:559
          7986331633204422a2b48f1386cbea9aff81204f:crates/agent/src/tools/list_directory_tool.rs:generic-api-key:884
          7986331633204422a2b48f1386cbea9aff81204f:crates/dev_container/src/devcontainer_manifest.rs:generic-api-key:9540
          EOF
          fi
          ./script/check-secrets
          ./script/check-macos-entitlements
          ./script/test-uninstall
          cargo fmt --all -- --check
          git diff --check
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '24.21.0'
          check-latest: false
          package-manager-cache: false
      - name: Build and package
        id: package
        env:
          BUILD_LOG: ${{ runner.temp }}/release-build.log
        run: |
          set -euo pipefail
          # Peak resident set size and elapsed time are recorded the same way the macOS
          # job records them, so runner sizing decisions have comparable data.
          ./script/download-wasi-sdk 2>&1 | tee -a "${BUILD_LOG}"
          /usr/bin/time -v ./script/bundle-linux 2>&1 | tee -a "${BUILD_LOG}"
      - name: Verify release archive
        env:
          ARCHITECTURE: ${{ inputs.architecture }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          archive="target/release/orion-studio-linux-${ARCHITECTURE}.tar.gz"
          remote_server_archive="target/orion-studio-remote-server-linux-${ARCHITECTURE}.gz"
          ./script/verify-linux-release \
            --archive "${archive}" \
            --architecture "${ARCHITECTURE}" \
            --remote-server-archive "${remote_server_archive}" \
            --expected-version "${RELEASE_TAG#v}"
      - name: Record build resources
        if: ${{ always() && (steps.package.outcome == 'success' || steps.package.outcome == 'failure') }}
        env:
          BUILD_LOG: ${{ runner.temp }}/release-build.log
          RELEASE_COMMIT: ${{ needs.validate_release.outputs.tag_commit }}
          RELEASE_TAG: ${{ inputs.tag }}
          ARCHITECTURE: ${{ inputs.architecture }}
        run: |
          set -euo pipefail
          archive="target/release/orion-studio-linux-${ARCHITECTURE}.tar.gz"
          available_kib=$(LC_ALL=C df -Pk "$GITHUB_WORKSPACE" | awk 'NR == 2 { print $4 }')
          target_bytes=$(du -sk target 2>/dev/null | awk '{ print $1 * 1024 }' || true)
          peak_rss_kib=$(awk '/Maximum resident set size/ { print $NF }' "${BUILD_LOG}" 2>/dev/null | sort -n | tail -1)
          # `/usr/bin/time -v` reports elapsed as h:mm:ss or m:ss, not a plain number,
          # so the raw string is recorded rather than run through a fragile parser.
          elapsed_reported=$(awk '/Elapsed \(wall clock\)/ { print $NF }' "${BUILD_LOG}" 2>/dev/null | tail -1)
          artifact_bytes=$(stat -c%s "${archive}" 2>/dev/null || echo 0)

          jq -n \
            --arg tag "$RELEASE_TAG" \
            --arg commit "$RELEASE_COMMIT" \
            --arg architecture "${ARCHITECTURE}" \
            --arg elapsed "${elapsed_reported:-}" \
            --argjson available_kib "${available_kib:-0}" \
            --argjson target_bytes "${target_bytes:-0}" \
            --argjson peak_rss_bytes "${peak_rss_kib:-0}" \
            --argjson artifact_bytes "${artifact_bytes:-0}" \
            '{
              tag: $tag,
              commit: $commit,
              architecture: $architecture,
              elapsed_reported: $elapsed,
              available_disk_bytes_after_build: ($available_kib * 1024),
              target_bytes: $target_bytes,
              peak_rss_bytes: $peak_rss_bytes,
              artifact_bytes: $artifact_bytes
            }' > "${RUNNER_TEMP}/build-resources.json"
          cat "${RUNNER_TEMP}/build-resources.json"
      - name: Write platform manifest
        env:
          RELEASE_COMMIT: ${{ needs.validate_release.outputs.tag_commit }}
          RELEASE_TAG: ${{ inputs.tag }}
          ARCHITECTURE: ${{ inputs.architecture }}
        run: |
          set -euo pipefail
          archive="target/release/orion-studio-linux-${ARCHITECTURE}.tar.gz"
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "orion-studio") | .version')
          sha256=$(sha256sum "${archive}" | awk '{ print $1 }')
          manifest="${RUNNER_TEMP}/platform-manifest.json"
          jq -n \
            --arg tag "$RELEASE_TAG" \
            --arg commit "$RELEASE_COMMIT" \
            --arg version "$version" \
            --arg architecture "${ARCHITECTURE}" \
            --arg artifact "orion-studio-linux-${ARCHITECTURE}.tar.gz" \
            --arg sha256 "$sha256" \
            '{
              tag: $tag,
              commit: $commit,
              version: $version,
              channel: "stable",
              platform: "linux",
              architecture: $architecture,
              artifact: $artifact,
              sha256: $sha256,
              signed: false,
              source_tag_signed: true,
              integrity_verified: true
            }' > "$manifest"
          jq -e '
            (.tag | test("^v[0-9]+\\.[0-9]+\\.[0-9]+$")) and
            (.commit | test("^[0-9a-f]{40}$")) and
            (.version | test("^[0-9]+\\.[0-9]+\\.[0-9]+$")) and
            (.channel == "stable") and
            (.platform == "linux") and
            (.architecture == "x86_64" or .architecture == "aarch64") and
            (.artifact | length > 0) and
            (.sha256 | test("^[0-9a-f]{64}$")) and
            (.signed == false) and
            (.source_tag_signed == true) and
            (.integrity_verified == true)
          ' "$manifest" > /dev/null
          [[ "${version}" == "${RELEASE_TAG#v}" ]]
          cat "$manifest"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: stable-linux-${{ inputs.architecture }}-${{ inputs.tag }}
          path: |
            target/release/orion-studio-linux-${{ inputs.architecture }}.tar.gz
            target/orion-studio-remote-server-linux-${{ inputs.architecture }}.gz
            ${{ runner.temp }}/build-resources.json
            ${{ runner.temp }}/platform-manifest.json
          if-no-files-found: error
          compression-level: 0

  runtime_acceptance:
    needs: [validate_release, build_release]
    if: ${{ always() && needs.validate_release.result == 'success' && (needs.build_release.result == 'success' || needs.build_release.result == 'skipped') }}
    runs-on: ${{ inputs.architecture == 'aarch64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    timeout-minutes: 30
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: stable-linux-release-support-${{ github.run_id }}
          path: ${{ runner.temp }}/release-support
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        if: ${{ inputs.source_run_id == '' }}
        with:
          name: stable-linux-${{ inputs.architecture }}-${{ inputs.tag }}
          path: ${{ runner.temp }}/release-artifacts
      - name: Download verified build artifact from prior run
        if: ${{ inputs.source_run_id != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          ARCHITECTURE: ${{ inputs.architecture }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          [[ "${SOURCE_RUN_ID}" =~ ^[0-9]+$ ]]
          [[ "$(gh run view "${SOURCE_RUN_ID}" --repo "${GITHUB_REPOSITORY}" --json workflowName --jq .workflowName)" == 'Release Linux Stable' ]]
          [[ "$(gh run view "${SOURCE_RUN_ID}" --repo "${GITHUB_REPOSITORY}" --json jobs --jq '[.jobs[] | select(.name == "build_release") | .conclusion] | first')" == success ]]
          gh run download "${SOURCE_RUN_ID}" --repo "${GITHUB_REPOSITORY}" \
            --name "stable-linux-${ARCHITECTURE}-${RELEASE_TAG}" \
            --dir "${RUNNER_TEMP}/release-artifacts"
      - name: Flatten and validate release artifact
        env:
          RELEASE_COMMIT: ${{ needs.validate_release.outputs.tag_commit }}
          ARCHITECTURE: ${{ inputs.architecture }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          artifact_directory="${RUNNER_TEMP}/release-artifacts"
          for artifact_name in \
            "orion-studio-linux-${ARCHITECTURE}.tar.gz" \
            "orion-studio-remote-server-linux-${ARCHITECTURE}.gz" \
            platform-manifest.json build-resources.json; do
            count=$(find "${artifact_directory}" -type f -name "${artifact_name}" | wc -l)
            [[ "${count}" -eq 1 ]]
            found=$(find "${artifact_directory}" -type f -name "${artifact_name}" -print -quit)
            if [[ "${found}" != "${artifact_directory}/${artifact_name}" ]]; then
              mv "${found}" "${artifact_directory}/${artifact_name}"
            fi
          done
          manifest="${artifact_directory}/platform-manifest.json"
          jq -e \
            --arg tag "${RELEASE_TAG}" \
            --arg commit "${RELEASE_COMMIT}" \
            --arg architecture "${ARCHITECTURE}" \
            '(.tag == $tag) and (.commit == $commit) and
             (.version == ($tag | ltrimstr("v"))) and
             (.channel == "stable") and (.platform == "linux") and
             (.architecture == $architecture) and
             (.artifact == ("orion-studio-linux-" + $architecture + ".tar.gz")) and
             (.signed == false) and (.source_tag_signed == true) and
             (.integrity_verified == true)' "${manifest}" > /dev/null
          actual_sha256=$(sha256sum "${artifact_directory}/orion-studio-linux-${ARCHITECTURE}.tar.gz" | awk '{ print $1 }')
          [[ "${actual_sha256}" == "$(jq -r .sha256 "${manifest}")" ]]
      - name: Check out validated release source
        env:
          RELEASE_COMMIT: ${{ needs.validate_release.outputs.tag_commit }}
        run: |
          set -euo pipefail
          git init "$GITHUB_WORKSPACE"
          git -C "$GITHUB_WORKSPACE" remote add release-source "https://github.com/${GITHUB_REPOSITORY}.git"
          git -C "$GITHUB_WORKSPACE" fetch --no-tags --depth=1 release-source "${RELEASE_COMMIT}"
          git -C "$GITHUB_WORKSPACE" checkout --detach --force FETCH_HEAD
          [[ "$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)" == "${RELEASE_COMMIT}" ]]
          [[ -z "$(git -C "$GITHUB_WORKSPACE" status --porcelain)" ]]
      - name: Apply verified runtime acceptance script
        env:
          EXPECTED_SUPPORT_SHA256: ${{ needs.validate_release.outputs.support_script_sha256 }}
        run: |
          set -euo pipefail
          support_directory="${RUNNER_TEMP}/release-support"
          actual_sha256=$(cat \
            "${support_directory}/bundle-linux" \
            "${support_directory}/verify-linux-release" \
            "${support_directory}/verify-linux-installation" \
            | shasum -a 256 | awk '{print $1}')
          [[ "${actual_sha256}" == "${EXPECTED_SUPPORT_SHA256}" ]]
          install -m 755 \
            "${support_directory}/verify-linux-installation" \
            "$GITHUB_WORKSPACE/script/verify-linux-installation"
      - name: Verify on the minimum supported Ubuntu release
        env:
          ARCHITECTURE: ${{ inputs.architecture }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [[ "${ARCHITECTURE}" == x86_64 ]]; then
            ubuntu_release=20.04
          else
            ubuntu_release=22.04
          fi
          dockerfile="${RUNNER_TEMP}/linux-acceptance.Dockerfile"
          cat > "${dockerfile}" <<EOF
          FROM ubuntu:${ubuntu_release}
          RUN apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
              ca-certificates dbus-x11 desktop-file-utils libasound2 libegl1 libfontconfig1 \
              libgl1 libglib2.0-0 libvulkan1 libwayland-client0 libx11-6 libx11-xcb1 \
              libxcb1 libxkbcommon-x11-0 mesa-vulkan-drivers procps xauth xdotool xvfb \
              && rm -rf /var/lib/apt/lists/* \
              && useradd --create-home --uid 1000 release-test
          USER release-test
          ENTRYPOINT ["/workspace/script/verify-linux-installation"]
          EOF
          docker build --file "${dockerfile}" --tag orion-linux-release-acceptance "${RUNNER_TEMP}"
          docker run --rm \
            --volume "$GITHUB_WORKSPACE:/workspace:ro" \
            --volume "$RUNNER_TEMP/release-artifacts:/artifacts:ro" \
            orion-linux-release-acceptance \
            --archive "/artifacts/orion-studio-linux-${ARCHITECTURE}.tar.gz" \
            --expected-version "${RELEASE_TAG#v}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: ${{ inputs.source_run_id != '' }}
        with:
          name: stable-linux-${{ inputs.architecture }}-${{ inputs.tag }}
          path: |
            ${{ runner.temp }}/release-artifacts/orion-studio-linux-${{ inputs.architecture }}.tar.gz
            ${{ runner.temp }}/release-artifacts/orion-studio-remote-server-linux-${{ inputs.architecture }}.gz
            ${{ runner.temp }}/release-artifacts/platform-manifest.json
            ${{ runner.temp }}/release-artifacts/build-resources.json
          if-no-files-found: error
          compression-level: 0
