# Generated from xtask::workflows::extensions::run_tests within the Orion Studio repository.
# Rebuild with `cargo xtask workflows`.
name: extensions::run_tests
on:
  pull_request:
    branches:
    - '**'
  push:
    branches:
    - main
permissions:
  contents: read
jobs:
  call_extension_tests:
    if: vars.ORION_STUDIO_EXTENSION_ORGANIZATION != '' && startsWith(vars.ORION_STUDIO_EXTENSION_ORGANIZATION, 'orion') && github.repository_owner == vars.ORION_STUDIO_EXTENSION_ORGANIZATION
    permissions:
      contents: read
    uses: orion-agents/orion-studio/.github/workflows/extension_tests.yml@main
concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}-${{ github.ref_name == 'main' && github.sha || 'anysha' }}pr
  cancel-in-progress: true
defaults:
  run:
    shell: bash -euxo pipefail {0}
